<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );
            font-family: 'Segoe UI', sans-serif;
        }

        .reset-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            margin: auto;
            margin-bottom: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eef2ff;

            color: #4f46e5;

            font-size: 30px;
        }

        .form-control {
            height: 50px;
        }

        .btn-reset {

            height: 50px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            border: none;

            color: white;

            font-weight: 600;

            border-radius: 10px;

        }

        .btn-reset:hover {

            background:
                linear-gradient(
                    135deg,
                    #4338ca,
                    #6d28d9
                );

        }

    </style>

</head>


<body>


<div class="reset-card">


    <div class="icon-box">

        <i class="bi bi-key"></i>

    </div>


    <h3 class="text-center mb-3">

        Forgot Password?

    </h3>


    <p class="text-center text-muted mb-4">

        Enter your email address and we'll send you a link
        to reset your password.

    </p>


    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">

                Email Address

            </label>


            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

        </div>


        <button
            type="submit"
            class="btn btn-reset w-100">

            Send Reset Link

        </button>

    </form>


    <div class="text-center mt-4">

        <a
            href="{% url 'college:login' %}"
            class="text-decoration-none">

            ← Back to Login

        </a>

    </div>


</div>


</body>

</html>
