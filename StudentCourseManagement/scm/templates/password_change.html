{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-key"></i>
                        Change Password
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        {% for field in form %}

                            <div class="mb-3">

                                <label class="form-label">
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% if field.errors %}
                                    <div class="text-danger mt-1">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}

                                {% if field.help_text %}
                                    <small class="text-muted">
                                        {{ field.help_text|safe }}
                                    </small>
                                {% endif %}

                            </div>

                        {% endfor %}

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Change Password
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
