{% extends 'admin_dashboard.html' %}

{% block content %}
<div class="container mt-4">

<h2>Teachers</h2>

<a href="{% url 'college:teacher_create' %}" class="btn btn-success mb-3">
    Add Teacher
</a>

<table class="table table-bordered table-striped">

<tr>

<th>Name</th>

<th>Phone</th>

<th>Qualification</th>

<th>Department</th>

<th>Actions</th>

</tr>

{% for teacher in teachers %}

<tr>

<td>{{ teacher.user.username }}</td>

<td>{{ teacher.phone }}</td>

<td>{{ teacher.qualification }}</td>

<td>{{ teacher.department.name }}</td>

<td>

<a href="{% url 'college:teacher_update' teacher.id %}" class="btn btn-primary btn-sm">
Edit
</a>

<a href="{% url 'college:teacher_delete' teacher.id %}" class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>
</div>
{% endblock %}
