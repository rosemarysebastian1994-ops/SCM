{% extends 'admin_dashboard.html' %}

{% block content %}
<div class="container mt-4">

<h2>Departments</h2>

<a href="{% url 'college:department_create' %}" class="btn btn-success mb-3">
    Add Department
</a>

<table class="table table-bordered table-striped">

<tr>

<th>Name</th>

<th>Description</th>

<th>Actions</th>

</tr>

{% for department in departments %}

<tr>

<td>{{ department.name }}</td>

<td>{{ department.description }}</td>

<td>

<a href="{% url 'college:department_update' department.id %}" class="btn btn-primary btn-sm">
Edit
</a>

<a href="{% url 'college:department_delete' department.id %}" class="btn btn-danger btn-sm">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>
</div>
{% endblock %}
